[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elfinfer"
version = "0.1.0"
description = "Inferencia de nombres de funciones en binarios ELF stripped con LLMs locales (Ollama)"
authors = [{ name = "Brayan Michel Reyes Castillo" }]
requires-python = ">=3.10"
dependencies = [
    "r2pipe>=1.9",
    "ollama>=0.4",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
elfinfer = "elfinfer.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
